# Last-touched: 2026-08-14 — the scan can now be run on demand. It was the only scheduled
# workflow here that could not be, and that gap had a cost: v0.5.0 was published twenty
# seconds AFTER the scan that was meant to grade it, so Signed-Releases went on reporting -1
# for something already fixed, with no way to re-measure short of pushing a commit for the
# sake of the score or waiting until Monday.
# Created 2026-08-05 — OpenSSF Scorecard: automated, third-party scoring of this
# repo's security posture. Results land in the Security tab; the badge is generated from
# the published results, so it cannot be faked by us.
name: OpenSSF Scorecard

on:
  # Manual re-measurement. Adds no permission the job did not already hold on every push to
  # main, and the results are public by design (publish_results below), so a manual run
  # republishes a score and discloses nothing.
  workflow_dispatch:
  branch_protection_rule:
  schedule:
    - cron: '31 4 * * 1'     # weekly, Monday
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload results to the Security tab
      id-token: write          # publish results so the badge can read them
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes results to the OpenSSF API so https://scorecard.dev can show them
          # and the README badge resolves. Set to false to keep results private.
          publish_results: true

      - name: Upload to the Security tab
        # This is codeql-action's SARIF *uploader*, not a CodeQL scan. CodeQL itself runs
        # through GitHub's default setup — see SECURITY.md for what it does and does not
        # cover. Reading this line as "the repo runs CodeQL" would be wrong.
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: results.sarif
