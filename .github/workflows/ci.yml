# Last-touched: 2026-08-13 — checkouts no longer persist the job token; compose linting uses a
# generated env because .env.example deliberately no longer resolves; and that refusal is
# itself asserted here, so the required-variable markers cannot be dropped unnoticed.
# Created 2026-08-04 during pre-public QA (GATE 1).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The translation-drift guards resolve commit SHAs, which a shallow clone cannot
          # do — checkout defaults to fetch-depth 1 and `git cat-file` then fails on every
          # recorded SHA. This guard was green locally and red here for exactly that reason.
          fetch-depth: 0
          # The token is not needed once the tree is here, and leaving it in .git/config is
          # a credential sitting in the workspace for every later step to read.
          persist-credentials: false
      # The suite SKIPS checks whose tool is missing, and a skip exits non-zero — so every
      # tool it needs has to be here or the job fails for the right reason. ImageMagick is
      # not on a stock runner and the media checks need it.
      - name: Install check dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
      # The full static suite: compose validation for both editions, storage-mapping and
      # listener assertions, secret/placeholder scans, digest pinning, hardening flags,
      # valid_domain() unit checks, docs presence. See tests/README.md.
      - name: tests/test_config.sh
        run: tests/test_config.sh

  e2e:
    name: End-to-end (real message)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Pulls images and stands the stack up; ~2 minutes. Runs on pushes and PRs because a
    # green static suite has, in this repo's history, coexisted with a stack that could
    # not boot at all.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The checkout action stores the job token in .git/config unless told
          # not to. Nothing here needs it, and scorecard.yml/pin-currency.yml
          # already refuse it — this job was the odd one out.
          persist-credentials: false
      - name: tests/test_e2e.sh
        run: tests/test_e2e.sh

  e2e-sso:
    name: End-to-end (SSO edition)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The SSO edition's "15/15 on the shipped Keycloak" claim was resting on one undated
    # local run. A claim the README makes is a claim CI has to hold, or it decays into
    # folklore the moment the shipped Keycloak version moves.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The checkout action stores the job token in .git/config unless told
          # not to. Nothing here needs it, and scorecard.yml/pin-currency.yml
          # already refuse it — this job was the odd one out.
          persist-credentials: false
      - name: tests/test_e2e.sh --sso
        env:
          FREEHOLDMAIL_TEST_KC_HOSTNAME_VALUE: https://id.qa.test
          FREEHOLDMAIL_TEST_PORT_BASE: "16400"
        run: tests/test_e2e.sh --sso

  lint:
    name: Lint and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The checkout action stores the job token in .git/config unless told
          # not to. Nothing here needs it, and scorecard.yml/pin-currency.yml
          # already refuse it — this job was the odd one out.
          persist-credentials: false

      - name: Shell syntax
        run: bash -n install.sh

      - name: ShellCheck
        # Installed from the distro rather than via a third-party action: one less
        # supply-chain dependency, and nothing here needs a marketplace action to run.
        # `style` is shellcheck's DEFAULT severity floor, so `-S style` changes nothing —
        # it is spelled out only to make the level explicit and to stop anyone "tightening"
        # it to -S error, which would hide findings. What actually matters here is the file
        # list: it must match the local suite, or the two gates drift apart.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S style install.sh tests/test_config.sh tests/test_e2e.sh \
            tests/lint_env.sh scripts/make_gif.sh

      - name: Python syntax and style
        # Every tracked .py file, not a hardcoded list: two scripts added in August were invisible
        # to this step because nobody remembered to name them here. A lint list that has to be
        # maintained by hand shrinks silently every time the repository grows.
        run: |
          mapfile -t PY < <(git ls-files '*.py')
          [ "${#PY[@]}" -gt 0 ] || { echo "::error::no Python files found — refusing to pass"; exit 1; }
          printf 'linting %d file(s): %s\n' "${#PY[@]}" "${PY[*]}"
          for f in "${PY[@]}"; do python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" "$f"; done
          sudo apt-get install -y -qq pycodestyle
          pycodestyle --max-line-length=100 "${PY[@]}"

      # .env.example ships every secret empty and the compose files mark them required, so it
      # no longer resolves on its own — that refusal is the point, and tests/test_config.sh
      # asserts it. Linting the file's shape is a different question, so build an env whose
      # required values are present and obviously fake. The list is read out of the compose
      # files by the script, never restated here: a hand-copied list is how two gates drift.
      - name: Build the lint env
        run: tests/lint_env.sh "$RUNNER_TEMP/lint.env"

      - name: Compose config (base edition)
        run: docker compose --env-file "$RUNNER_TEMP/lint.env" -f docker-compose.yml config -q

      - name: Compose config (SSO edition)
        run: |
          docker compose --env-file "$RUNNER_TEMP/lint.env" \
            -f docker-compose.yml -f docker-compose.sso.yml config -q

      # The refusal itself is a security control, so CI has to see it fail. Without this, the
      # required-variable markers could be dropped and every other check would stay green.
      - name: The shipped example alone must not resolve
        run: |
          if docker compose --env-file .env.example \
               -f docker-compose.yml -f docker-compose.sso.yml config -q 2>/dev/null; then
            echo '::error::.env.example resolved a runnable config: the required-variable
          markers have been dropped, so copying the example yields empty secrets silently'
            exit 1
          fi
          echo "refused, as intended"

      - name: No unresolved placeholders
        # Match placeholder VALUES in files that configure the stack — not prose in
        # docs (CHANGELOG legitimately mentions the word) and not this workflow itself.
        run: |
          if grep -rnE '=[A-Za-z_]*CHANGEME' \
               .env.example install.sh docker-compose.yml docker-compose.sso.yml config/; then
            echo "::error::placeholder value left in a config file"; exit 1
          fi
          if grep -rn 'SET-BEFORE-PUBLISHING' NOTICE LICENSE README.md; then
            echo "::error::publishing placeholder left in a legal/landing file"; exit 1
          fi

      - name: No committed secrets
        run: |
          if grep -rnE '(SECRET|PASSWORD|TOKEN|API_KEY)=[A-Za-z0-9+/=_-]{8,}' \
               --exclude-dir=.git --exclude=CHANGELOG.md --exclude=SUPPORT.md .; then
            echo "::error::possible secret committed"; exit 1
          fi

      - name: No secret or operator data tracked
        # A public repo must never carry an operator's mailbox, dumps, certs or .env.
        run: |
          pattern='(^|/)\.env($|\.)'
          pattern="$pattern"'|\.(pem|key|crt|p12|pfx|bak|tar\.gz|tgz|sql|sql\.gz|dump)$'
          pattern="$pattern"'|^backups?/'
          bad=$(git ls-files | grep -E "$pattern" | grep -v '^\.env\.example$' || true)
          if [ -n "$bad" ]; then
            echo "::error::secret or operator data tracked by git:"; echo "$bad"; exit 1
          fi

      - name: Images are digest-pinned
        # A tag can be re-pointed by whoever can push; a digest cannot. This FAILS the
        # build — it used to emit `::warning::`, which never fails anything, so the one
        # check guarding the supply chain was decorative while the webmail rode `:latest`.
        run: |
          missing=$(grep -E '^[A-Z_]+_DIGEST=$' .env.example || true)
          if [ -n "$missing" ]; then
            echo "::error::unpinned images in .env.example:"; echo "$missing"; exit 1
          fi
          # Assert against the resolved config, not the raw files: those hold
          # ${BULWARK_VERSION}, so grepping them for `:latest` inspects a placeholder.
          resolved=$(docker compose --env-file "$RUNNER_TEMP/lint.env" \
            -f docker-compose.yml -f docker-compose.sso.yml config | grep -E '^[[:space:]]+image:')
          total=$(grep -c 'image:' <<<"$resolved")
          pinned=$(grep -c '@sha256:' <<<"$resolved")
          if [ "$total" -eq 0 ] || [ "$pinned" -ne "$total" ]; then
            echo "::error::only $pinned/$total resolved images are digest-pinned"
            grep -v '@sha256:' <<<"$resolved"; exit 1
          fi
          if grep -qE ':latest([[:space:]]|@|$)' <<<"$resolved"; then
            echo "::error::a resolved image rides the mutable :latest tag"; exit 1
          fi
          echo "all $pinned/$total resolved images are digest-pinned"

  yaml:
    name: YAML syntax
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The checkout action stores the job token in .git/config unless told
          # not to. Nothing here needs it, and scorecard.yml/pin-currency.yml
          # already refuse it — this job was the odd one out.
          persist-credentials: false
      # From the distro, not pip: an unpinned `pip install` is an unpinned dependency, and
      # OpenSSF Scorecard flags it (PinnedDependenciesID) in a repo whose own rule is that
      # everything is pinned. apt packages come from the runner image, which IS pinned.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq yamllint
      # Block scalar on purpose: the inline flow mapping in the -d argument contains
      # `: ` and makes a plain scalar unparseable as YAML.
      - run: |
          yamllint -d '{extends: relaxed, rules: {line-length: {max: 120}}}' .
