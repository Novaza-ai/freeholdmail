# Last-touched: 2026-08-04 — GATE-1/2/3 QA: real verified image coordinates, digest pinning,
# container hardening, healthchecks, and a persistent volume for webmail settings.
#
# Base edition = "Full Mail" (mail server + webmail, native login, NO Keycloak).
# For the SSO edition (adds Keycloak + OAuth), also include docker-compose.sso.yml:
#   docker compose -f docker-compose.yml -f docker-compose.sso.yml up -d
#
# Orchestration only — no third-party source here. See THIRD_PARTY_LICENSES.md.
# NO SECRETS HARDCODED — all come from .env (install.sh generates them).
#
# SUPPLY CHAIN: ${*_DIGEST} pins each image to a content digest. .env.example ships the
# digest that was actually tested; `docker pull <image>@<digest>` is reproducible, a tag is not.

services:
  mailserver:
    # Verified coordinate: Docker Hub `stalwartlabs/mail-server`. NOTE: upstream has since
    # renamed the repo to `stalwartlabs/stalwart` and moved config to /etc/stalwart +
    # data to /var/lib/stalwart from v0.16. This file targets the v0.11.x layout, which is
    # what has been E2E-tested here. See CHANGELOG "Known gaps" before upgrading.
    image: stalwartlabs/mail-server:${STALWART_VERSION}${STALWART_DIGEST}
    container_name: freeholdmail-mailserver
    restart: unless-stopped
    environment:
      STALWART_HOSTNAME: ${MAIL_DOMAIN}
      STALWART_FALLBACK_ADMIN_SECRET: ${STALWART_FALLBACK_ADMIN_SECRET}
    volumes:
      - ./config/stalwart/config.toml:/opt/stalwart-mail/etc/config.toml:ro
      - mailserver_data:/opt/stalwart-mail
      - ${TLS_FULLCHAIN}:/opt/tls/fullchain.pem:ro
      - ${TLS_PRIVKEY}:/opt/tls/privkey.pem:ro
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "993:993"
      # The admin API. Every doc's first step — creating your domain and first mailbox —
      # calls http://127.0.0.1:8080/api/principal, which was impossible because this port
      # was never published. Bound to LOOPBACK ONLY and deliberately not proxied by nginx:
      # this API returns account passwords in cleartext (see SECURITY.md), so it must never
      # be reachable from the internet. Reach it over SSH port-forwarding from elsewhere.
      - "127.0.0.1:8080:8080"
    security_opt:
      - no-new-privileges:true
    # Drop every capability, then hand back only what the process provably needs.
    # NET_BIND_SERVICE: this container listens on 25/465/587/993, all below 1024.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    # An unbounded container log fills the host disk and takes the mail server down with it.
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
    # Bounds, not tuning. A mail server that starts consuming without limit should be
    # stopped by the kernel rather than take the machine with it. Raise for a busy server.
    mem_limit: 1g
    pids_limit: 512
    healthcheck:
      # The JMAP/HTTP listener accepting a connection is the earliest honest signal that
      # the stores opened. The image ships neither curl nor wget nor nc — bash's /dev/tcp
      # is the dependency-free way to probe it (verified: /usr/bin/bash exists).
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  webmail:
    # Verified coordinate: GitHub Container Registry, the project's official publisher.
    image: ${BULWARK_IMAGE}:${BULWARK_VERSION}${BULWARK_DIGEST}
    container_name: freeholdmail-webmail
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME}
      JMAP_SERVER_URL: "https://${MAIL_DOMAIN}"
      SESSION_SECRET: ${WEBMAIL_SESSION_SECRET}
      # Full Mail edition: native login against the mail server, OAuth OFF.
      OAUTH_ENABLED: "false"
      # Without this volume+path, user settings are lost on every container replacement.
      SETTINGS_DATA_DIR: /data/settings
    volumes:
      - webmail_data:/data
    expose:
      - "3000"
    security_opt:
      - no-new-privileges:true
    # Listens on 3000, an unprivileged port, so it needs nothing back.
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
    mem_limit: 768m
    pids_limit: 256

  proxy:
    image: nginx:${NGINX_VERSION}${NGINX_DIGEST}
    container_name: freeholdmail-proxy
    restart: unless-stopped
    depends_on:
      webmail:
        condition: service_started
      mailserver:
        condition: service_healthy
    volumes:
      - ./config/nginx/mail.conf:/etc/nginx/conf.d/mail.conf:ro
      # Mask the image's stock default.conf. It sorts before mail.conf, so it wins as the
      # default server on :80 and answers any unmatched Host with "Welcome to nginx!" —
      # a 200 with none of our security headers, instead of the redirect to HTTPS.
      - /dev/null:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_FULLCHAIN}:/etc/nginx/tls/fullchain.pem:ro
      - ${TLS_PRIVKEY}:/etc/nginx/tls/privkey.pem:ro
    ports:
      - "80:80"
      - "443:443"
    security_opt:
      - no-new-privileges:true
    # nginx starts as root to bind 80/443, then drops its workers to the `nginx` user —
    # SETUID/SETGID are what that drop needs, CHOWN and DAC_OVERRIDE are for its cache and
    # temp directories. Removing any one of these stops the workers from starting.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID, CHOWN, DAC_OVERRIDE]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
    mem_limit: 256m
    pids_limit: 256

volumes:
  mailserver_data:
  webmail_data:
